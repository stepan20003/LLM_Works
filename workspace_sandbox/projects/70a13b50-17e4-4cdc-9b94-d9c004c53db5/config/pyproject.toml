# Project dependencies and metadata
[tool.poetry]
name = "calculator-api"
version = "1.0.0"
description = "API for performing calculator operations"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.92.2"
uvicorn = "^0.19.0"
sqlalchemy = "^1.4.39"
psycopg2-binary = "^2.9.5"
pytest = "^6.2.5"
pytest-cov = "^2.12.1"
pytest-flask = "^0.15.0"
pytest-asyncio = "^0.17.0"

[tool.poetry.dev-dependencies]
pytest-watch = "^4.0.0"
black = "^22.3.0"
isort = "^5.10.1"

[tool.black]
line_length = 88

[tool.isort]
profile = "black"